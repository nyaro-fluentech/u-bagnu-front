name: Healthcheck

on:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed
  schedule:
    # Toutes les heures
    - cron: "0 * * * *"

jobs:
  healthcheck:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Check site availability
        id: check
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            https://client-a.fluen.tech)

          echo "status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "HEALTHCHECK_FAILED=true" >> "$GITHUB_ENV"
            echo "::error::Site responded with HTTP $HTTP_STATUS"
          fi

      - name: Create GitHub Issue on failure
        if: env.HEALTHCHECK_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.check.outputs.status }}'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const trigger = context.eventName === 'workflow_run'
              ? 'après un déploiement'
              : 'lors du healthcheck horaire'

            // Rechercher une issue ouverte identique pour éviter les doublons
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'healthcheck,incident',
            })

            if (existing.data.length > 0) {
              console.log(`Issue ouverte existante #${existing.data[0].number}, pas de doublon.`)
              return
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[INCIDENT] Site indisponible — HTTP ${status}`,
              labels: ['healthcheck', 'incident'],
              body: [
                `## Incident détecté`,
                ``,
                `Le healthcheck ${trigger} a échoué.`,
                ``,
                `| Champ | Valeur |`,
                `|-------|--------|`,
                `| URL vérifiée | https://client-a.fluen.tech |`,
                `| Code HTTP retourné | \`${status}\` |`,
                `| Date | ${new Date().toISOString()} |`,
                `| Workflow run | [Voir les logs](${runUrl}) |`,
                ``,
                `## Actions immédiates`,
                ``,
                `- [ ] Vérifier les logs Docker sur le VPS : \`docker compose logs -f\``,
                `- [ ] Vérifier le tunnel Cloudflare`,
                `- [ ] Rollback si nécessaire via le workflow Deploy (workflow_dispatch avec un SHA stable)`,
              ].join('\n'),
            })
